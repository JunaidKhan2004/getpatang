name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, unit, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Example values are enough for tests: every e2e file uses its own throwaway SQLite database.
      - run: cp .env.example .env
      - run: npx tsc -p tsconfig.build.json --noEmit
      # Production PostgreSQL migrations must match prisma/schema.prisma.
      - run: npm run db:pg:check
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e

  web:
    name: Web (lint, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # No API during CI; pages that load data at build time fall back to their empty states.
      API_URL: http://127.0.0.1:9/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  containers:
    name: Production containers (PostgreSQL smoke test)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: sh deploy/ci-smoke.sh

  mobile:
    name: Mobile (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed --line-length 120 lib test
      - run: flutter analyze
      - run: flutter test
